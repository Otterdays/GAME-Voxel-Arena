<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaFPS</title>
    <link rel="icon" type="image/png" href="main.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- UI Menus -->
    <div id="ui-container">
        <!-- Start Menu -->
        <div id="start-menu" class="menu active">
            <h1>ArenaFPS</h1>
            <button id="single-player-button">Single Player</button>
            <button id="multiplayer-button">Multiplayer</button>
            <button id="settings-button">Settings</button>
            <button id="quit-button">Quit</button>
        </div>

        <!-- Map Selection Menu -->
        <div id="map-selection-menu" class="menu">
            <h2>Select Map</h2>
            <div id="map-display">
                <!-- Map details will be populated here -->
            </div>
            <button id="start-map-button">Start Map</button>
            <button id="map-selection-back-button">Back</button>
        </div>

        <!-- Settings Menu -->
        <div id="settings-menu" class="menu">
            <h2>Settings</h2>
            <div class="settings-section">
                <h3>Audio</h3>
                <label for="volume-slider">Master Volume</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
                <label for="music-volume-slider">Music Volume</label>
                <input type="range" id="music-volume-slider" min="0" max="1" step="0.1" value="0.5">
            </div>
            <div class="settings-section">
                <h3>Video</h3>
                <div id="video-settings-container">
                    <!-- Video settings will be populated by JavaScript -->
                </div>
            </div>
            <div class="settings-section">
                <h3>Keybinds</h3>
                <p class="instruction-text">Click a button to rebind</p>
                <div id="keybinds-container">
                    <!-- Keybinds will be populated by JavaScript -->
                </div>
            </div>
            <div id="settings-message" class="message"></div>
            <div class="settings-actions">
                <button id="apply-settings-button">Apply</button>
                <button id="cancel-settings-button">Cancel</button>
            </div>
            <button id="back-button">Back</button>
        </div>

        <!-- Pause Menu -->
        <div id="pause-menu" class="menu">
            <h2>Paused</h2>
            <button id="resume-button">Resume</button>
            <button id="quit-to-main-menu-button">Main Menu</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div id="crosshair">+</div>
        </div>

        <!-- Custom Cursor -->
        <div id="custom-cursor"></div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
