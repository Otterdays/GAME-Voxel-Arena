<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Arena — Stand Down</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#141a12">
    <style>
        :root {
            --tac-bg: #0c100c;
            --tac-panel: #141a12;
            --tac-border: #5a6b3a;
            --tac-accent: #c4a35a;
            --tac-text: #c8d0b8;
            --tac-muted: #7a8570;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 50% 20%, #1a2416 0%, transparent 55%),
                linear-gradient(180deg, #0c100c 0%, #10160e 100%);
            color: var(--tac-text);
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            padding: 40px 20px;
        }
        .standdown {
            width: min(440px, 100%);
            padding: 36px 28px;
            background: var(--tac-panel);
            border: 1px solid var(--tac-border);
            position: relative;
        }
        .standdown::before,
        .standdown::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid var(--tac-accent);
        }
        .standdown::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .standdown::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        .classif {
            font-size: 0.7rem;
            letter-spacing: 0.28em;
            color: var(--tac-accent);
            margin-bottom: 18px;
        }
        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            margin: 0 0 8px;
            color: #e8ecd8;
        }
        p {
            margin: 0 0 28px;
            color: var(--tac-muted);
            font-size: 0.9rem;
            letter-spacing: 0.06em;
        }
        a {
            display: inline-block;
            color: var(--tac-panel);
            background: var(--tac-accent);
            text-decoration: none;
            border: 1px solid var(--tac-accent);
            padding: 12px 28px;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            transition: background 0.2s, color 0.2s;
        }
        a:hover {
            background: transparent;
            color: var(--tac-accent);
        }
    </style>
</head>
<body>
    <div class="standdown">
        <div class="classif">MISSION COMPLETE</div>
        <h1>VOXEL ARENA</h1>
        <p>Operator stood down. Fireteam dismissed.</p>
        <a href="index.html">Re-Deploy</a>
    </div>
</body>
</html>
